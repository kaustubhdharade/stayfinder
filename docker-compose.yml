services:
  postgres:
    image: postgres:16-alpine
    container_name: stayfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stayfinder
    ports:
      - "5432:5432"
    volumes:
      - stayfinder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stayfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stayfinder_pgdata:
